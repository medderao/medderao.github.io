<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado pela sua Raiz Abundante!</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root {
      --text: #1e293b;
      --light-text: #64748b;
      --bg: #ffffff;
      --card-bg: #e6f4ea;
      --eco: #2e7d32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--eco);
      margin-bottom: 16px;
    }
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--light-text);
      font-size: 0.9rem;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.9rem; }
      .form-container iframe { height: 1100px !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍎 Obrigado por nutrir com uma Raiz Abundante!</h1>
      <p>Sua escolha vai além do plantio: você está alimentando corpos, atraindo pássaros e fortalecendo comunidades com uma árvore frutífera.</p>
    </header>
    
    <main>
      <div class="form-container">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScMjzLKphCkeksPv1GWCkHn53ZBdpsNLq9XF7BYWHyly4S75g/viewform?embedded=true" 
                width="100%" height="1291" frameborder="0" marginheight="0" marginwidth="0">
          Carregando…
        </iframe>
      </div>
    </main>
    
    <footer>
      <p>EcoEsfera: Regeneração com Prova</p>
    </footer>
  </div>
</body>
</html>
