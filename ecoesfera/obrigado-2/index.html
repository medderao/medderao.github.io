<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adote suas Raízes Coletivas – EcoEsfera</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root {
      --text: #1e293b;
      --light-text: #64748b;
      --bg: #ffffff;
      --card-bg: #e6f4ea;
      --eco: #2e7d32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--eco);
      margin-bottom: 16px;
    }
    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text);
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
    }
    .form-group input:focus {
      outline: 2px solid var(--eco);
      outline-offset: 2px;
    }
    .submit-button {
      background-color: var(--eco);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      font-weight: 500;
      font-size: 1.05rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.25s ease;
    }
    .submit-button:hover {
      background-color: #1b5e20;
      transform: translateY(-2px);
    }
    .payment-section {
      text-align: center;
      padding: 25px 20px;
    }
    .payment-title {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: var(--eco);
    }
    .mp-button-container {
      display: inline-block;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--light-text);
      font-size: 0.9rem;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌳 Adote suas Raízes Coletivas</h1>
      <p>Fortaleça duas mudas que crescerão juntas. Preencha seus dados para personalizar seu impacto.</p>
    </header>
    
    <main>
      <!-- Formulário nativo -->
      <div class="section">
        <form action="https://formspree.io/f/xangdnek" method="POST">
          <div class="form-group">
            <label for="nome">Seu nome</label>
            <input type="text" id="nome" name="nome" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail para envio do certificado</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="nome-muda">Como você quer nomear suas mudas?</label>
            <input type="text" id="nome-muda" name="nome_muda" placeholder="Ex: Irmãs do Rio, Raízes da Clara e Theo" required>
          </div>
          <button type="submit" class="submit-button">
            Enviar dados e prosseguir para o pagamento
          </button>
        </form>
      </div>

      <!-- Pagamento -->
      <div class="payment-section">
        <div class="payment-title">✅ Dados enviados! Finalize com seu pagamento.</div>
        <div class="mp-button-container">
          <script src="https://www.mercadopago.com.br/integrations/v1/web-payment-checkout.js"
                  data-preference-id="3019692997-3a60a052-d337-4c46-afc7-3ea5770056f3"
                  data-source="button">
          </script>
        </div>
      </div>
    </main>
    
    <footer>
      <p>EcoEsfera: Regeneração com Prova</p>
    </footer>
  </div>
</body>
</html>
